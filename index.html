<script>

const HOME={
 title:'Blue Summer Rain',
 searchText:'여름비, 파랑',

 // 카테고리별 메인 일러스트 경로입니다. 기존 홈페이지의 파일명을 사용합니다.

(()=>{'use strict';
const $=id=>document.getElementById(id),button=$('searchButton'),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

 ++selectionToken;hero.src=defaultHero;hero.alt='페어 홈 일러스트';hero.closest('.tablet').classList.remove('loading');
 $('selectionName').textContent='여름비, 파랑';$('heroPlay').href=HOME.homePage;$('heroPlay').setAttribute('aria-label','Romance 페이지로 이동');$('selectionStatus').textContent='';
 options.forEach(item=>item.setAttribute('aria-pressed',String(item.dataset.category==='romance')));setMenu(false);
}

function selectCategory(option){
 const key=option.dataset.category,label=option.firstElementChild.textContent,token=++selectionToken;
 options.forEach(item=>item.setAttribute('aria-pressed',String(item===option)));
 $('selectionName').textContent=key==='romance'?'여름비, 파랑':label;$('heroPlay').href=HOME.categories[key];$('heroPlay').setAttribute('aria-label',label+' 페이지로 이동');$('selectionStatus').textContent='';
 setMenu(false);categoryButton.focus({preventScroll:true});
 const frame=hero.closest('.tablet');frame.classList.add('loading');
 const preview=new Image();preview.onload=()=>{if(token!==selectionToken)return;hero.src=preview.src;hero.alt=label+' 메인 일러스트';frame.classList.remove('loading')};
 preview.onerror=()=>{if(token!==selectionToken)return;hero.src=defaultHero;hero.alt='페어 메인 일러스트';frame.classList.remove('loading');$('selectionStatus').textContent=label+' 일러스트를 불러오지 못해 메인 그림을 표시했어요.'};
 preview.src=HOME.categoryImages[key]||defaultHero;
}
options.forEach(option=>option.addEventListener('click',()=>selectCategory(option)));
document.addEventListener('pointerdown',e=>{if(!dock.contains(e.target))setMenu(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!menu.hidden){setMenu(false);categoryButton.focus()}else if(e.key==='Enter'&&!entered&&e.target===document.body){e.preventDefault();enter()}});
dock.addEventListener('focusout',()=>setTimeout(()=>{if(!dock.contains(document.activeElement))setMenu(false)},0));
let booted=false;function boot(){if(booted)return;booted=true;type()}
if(document.fonts?.ready){Promise.race([document.fonts.ready,new Promise(resolve=>setTimeout(resolve,800))]).then(boot)}else boot();
/* 기존 common.js가 사용하는 ID를 유지합니다. */
const audio=$('bgm');
function sync(){const play=$('music-btn');play.textContent=audio.paused?'▶':'Ⅱ';play.setAttribute('aria-label',audio.paused?'음악 재생':'음악 일시정지')}
['play','pause','ended','emptied'].forEach(e=>audio.addEventListener(e,sync));
async function toggle(){ $('musicStatus').textContent='';try{if(commonReady&&typeof window.toggleMusic==='function')await window.toggleMusic();else if(audio.paused){if(!audio.getAttribute('src')&&!audio.querySelector('source')){$('musicStatus').textContent='음악 파일을 준비 중입니다.';return}await audio.play()}else audio.pause()}catch{$('musicStatus').textContent='음악을 불러오지 못했어요.'}sync()}
$('music-btn').onclick=toggle;
function track(dir){$('musicStatus').textContent='';if(!commonReady)return;const fn=dir<0?window.prevTrack:window.nextTrack;if(typeof fn==='function'){try{const result=fn();if(result?.catch)result.catch(()=>{$('musicStatus').textContent='음악을 불러오지 못했어요.'})}catch{$('musicStatus').textContent='음악을 불러오지 못했어요.'}}}
$('previousTrack').onclick=()=>track(-1);$('followingTrack').onclick=()=>track(1);
function useFallback(){if(fallback)return;fallback=true;commonReady=false;$('previousTrack').disabled=true;$('followingTrack').disabled=true;if(HOME.musicFile){audio.src=HOME.musicFile;audio.loop=true;audio.load()}}
if(HOME.commonScript){const script=document.createElement('script');script.src=HOME.commonScript;script.onload=()=>{commonReady=typeof window.toggleMusic==='function';if(!commonReady)useFallback();sync()};script.onerror=useFallback;document.body.append(script)}else useFallback();
audio.addEventListener('error',()=>{$('musicStatus').textContent='음악을 불러오지 못했어요.'});sync();
})();
</script>
<script>
/* Music bar: visual viewport anchoring, independent of transformed containers. */
(()=>{
 const css=document.createElement('style');css.textContent=`
:root{--music-viewport-inset:0px}
body{padding-bottom:100px!important}
body:not(.entered):has(#homeScreen[hidden]){padding-bottom:0!important}
#music-player{position:fixed!important;left:50%!important;right:auto!important;top:auto!important;bottom:calc(var(--music-viewport-inset) + max(16px,env(safe-area-inset-bottom,0px)))!important;transform:translateX(-50%)!important;margin:0!important;animation:none!important;width:var(--music-fixed-width,min(660px,calc(100% - 36px)))!important;max-width:calc(100% - 28px)!important;z-index:100!important}
#homeScreen{padding-bottom:38px!important;min-height:calc(100svh - 100px)}
.tablet{--picture-inset:7px;position:relative;padding:0!important;overflow:hidden;isolation:isolate}
.tablet>img{position:absolute!important;inset:var(--picture-inset)!important;width:calc(100% - var(--picture-inset)*2)!important;height:calc(100% - var(--picture-inset)*2)!important;object-fit:cover!important;z-index:0}
.tablet>.hero-overlay{position:absolute!important;inset:var(--picture-inset)!important;width:auto!important;height:auto!important;margin:0!important;z-index:1;overflow:hidden;background:linear-gradient(180deg,rgba(16,8,25,0) 35%,rgba(16,8,25,.16) 60%,rgba(16,8,25,.67) 100%)!important}
@media(max-width:700px){.tablet{--picture-inset:5px}}
`;
 // Set the width separately to keep the category pages' original size.
 css.textContent=css.textContent.replace('calc(100% - 36px))))','calc(100% - 36px)))');
 document.head.append(css);
 const player=document.getElementById('music-player'),home=document.getElementById('homeScreen');
 if(!player)return;
 function mount(){if(home?.hidden)return;document.body.append(player);update()}
 function update(){const v=window.visualViewport;const covered=v&&v.scale===1?Math.max(0,window.innerHeight-v.height-v.offsetTop):0;document.documentElement.style.setProperty('--music-viewport-inset',covered+'px');if(home&&!home.hidden)player.style.setProperty('--music-fixed-width',home.getBoundingClientRect().width+'px')}
 mount();if(home)new MutationObserver(()=>{if(!home.hidden&&player.parentElement!==document.body)mount()}).observe(home,{attributes:true,attributeFilter:['hidden']});
 window.addEventListener('resize',update);window.addEventListener('orientationchange',update);window.visualViewport?.addEventListener('resize',update);window.visualViewport?.addEventListener('scroll',update);update();
})();
</script>
