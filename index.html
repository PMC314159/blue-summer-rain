<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#25252a" />
  <title>Stills | Blue Summer Rain</title>

  <style>
    @font-face {
      font-family: "GmarketSans";
      src: url("../GmarketSansTTFLight.ttf") format("truetype");
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #25252a;
      --panel: #2b2b31;
      --text: #f1f1f2;
      --muted: #aaaab0;
      --line: rgba(255,255,255,.12);
      --line-strong: rgba(255,255,255,.18);
      --accent: #d8e3d4;
      --shadow: rgba(0,0,0,.28);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "GmarketSans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 300;
      letter-spacing: -0.025em;
      background:
        radial-gradient(circle at 12% 8%, rgba(159,180,225,.08), transparent 25%),
        radial-gradient(circle at 88% 82%, rgba(191,223,194,.06), transparent 28%),
        var(--bg);
    }

    body.modal-open { overflow: hidden; }

    a {
      color: inherit;
      text-decoration: none;
    }

    button { font: inherit; }

    .page {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 40px 0 132px;
    }

    .topbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 34px;
    }

    .back {
      display: inline-flex;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .08em;
      transition: opacity .2s ease, transform .2s ease;
    }

    .back:hover {
      opacity: .72;
      transform: translateX(-2px);
    }

    .page-title {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .30em;
      text-transform: uppercase;
    }

    .still-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
    }

    .still-card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: rgba(26,26,30,.54);
      box-shadow: 0 18px 46px var(--shadow);
      cursor: pointer;
      transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
    }

    .still-card:hover,
    .still-card:focus-visible {
      transform: translateY(-3px);
      border-color: rgba(216,227,212,.30);
      box-shadow: 0 23px 54px rgba(0,0,0,.34);
      outline: none;
    }

    .thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      background: #17171a;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform .45s cubic-bezier(.2,.7,.2,1);
    }

    .still-card:hover .thumb img,
    .still-card:focus-visible .thumb img {
      transform: scale(1.015);
    }

    /* 썸네일별 보이는 위치 */
    .still-card[data-still="1"] .thumb img { object-position: center 48%; }
    .still-card[data-still="2"] .thumb img { object-position: center 50%; }
    .still-card[data-still="3"] .thumb img { object-position: center 50%; }
    .still-card[data-still="4"] .thumb img { object-position: center 48%; }
    .still-card[data-still="5"] .thumb img { object-position: center 46%; }
    .still-card[data-still="6"] .thumb img { object-position: center 52%; }
    .still-card[data-still="7"] .thumb img { object-position: center 50%; }

    .card-info {
      padding: 21px 24px 23px;
      border-top: 1px solid rgba(255,255,255,.07);
    }

    .still-name {
      margin: 0;
      color: #eeeeef;
      font-size: 16px;
      letter-spacing: .035em;
    }

    .multi-mark {
      margin-top: 8px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .10em;
    }

    /* =========================
       FULLSCREEN VIEWER
       ========================= */

    .viewer {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 70px 88px 54px;
      background: rgba(4,4,6,.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .viewer.open { display: flex; }

    .viewer::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 20%, rgba(55,65,135,.10), transparent 32%),
        radial-gradient(circle at 82% 76%, rgba(100,120,100,.07), transparent 30%);
    }

    .viewer-stage {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .viewer-image {
      max-width: 100%;
      max-height: 100%;
      display: block;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      box-shadow: 0 20px 70px rgba(0,0,0,.35);
    }

    .viewer-close {
      position: absolute;
      z-index: 3;
      top: 24px;
      right: 30px;
      border: 0;
      padding: 8px 10px;
      color: #dcdce2;
      background: transparent;
      font-size: 13px;
      letter-spacing: .15em;
      cursor: pointer;
    }

    .viewer-close:hover { opacity: .68; }

    .nav-btn {
      position: absolute;
      z-index: 3;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      display: none;
      place-items: center;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 50%;
      color: #f2f2f3;
      background: rgba(20,20,24,.56);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
    }

    .nav-btn.show { display: grid; }

    .nav-btn:hover {
      background: rgba(255,255,255,.10);
    }

    .nav-prev { left: 24px; }
    .nav-next { right: 24px; }

    .viewer-caption {
      position: absolute;
      z-index: 3;
      left: 28px;
      bottom: 24px;
      color: rgba(235,235,239,.76);
      font-size: 12px;
      letter-spacing: .08em;
    }

    .viewer-counter {
      position: absolute;
      z-index: 3;
      right: 30px;
      bottom: 24px;
      color: rgba(235,235,239,.58);
      font-size: 11px;
      letter-spacing: .12em;
    }

    /* shared music player */
    .music-player {
      position: fixed;
      z-index: 50;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      width: min(720px, calc(100% - 32px));
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 9px 13px 9px 18px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      color: var(--text);
      background: rgba(34,34,39,.90);
      box-shadow: 0 14px 38px rgba(0,0,0,.26);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .music-left,
    .music-controls {
      display: flex;
      align-items: center;
    }

    .music-left {
      gap: 11px;
      min-width: 0;
    }

    .music-icon {
      color: var(--accent);
      font-size: 18px;
      flex: 0 0 auto;
    }

    .music-title {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      color: #d9d9dc;
      font-size: 12px;
    }

    .music-controls {
      gap: 4px;
      flex: 0 0 auto;
    }

    .music-btn {
      width: 39px;
      height: 39px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      color: var(--text);
      background: rgba(255,255,255,.045);
      cursor: pointer;
    }

    .music-btn.small {
      width: 32px;
      height: 32px;
      border-color: transparent;
      background: transparent;
      font-size: 18px;
    }

    @media (max-width: 720px) {
      .page {
        width: min(100% - 24px, 1120px);
        padding-top: 24px;
        padding-bottom: 116px;
      }

      .topbar {
        margin-bottom: 22px;
      }

      .still-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .still-card {
        border-radius: 20px;
      }

      .card-info {
        padding: 17px 19px 19px;
      }

      .still-name {
        font-size: 14px;
      }

      .viewer {
        padding: 64px 16px 62px;
      }

      .viewer-close {
        top: 16px;
        right: 14px;
      }

      .nav-btn {
        width: 42px;
        height: 42px;
        top: auto;
        bottom: 14px;
        transform: none;
        font-size: 24px;
      }

      .nav-prev { left: 18px; }
      .nav-next { right: 18px; }

      .viewer-caption {
        left: 50%;
        bottom: 26px;
        transform: translateX(-50%);
        white-space: nowrap;
      }

      .viewer-counter {
        right: 50%;
        bottom: 11px;
        transform: translateX(50%);
      }

      .music-player {
        bottom: 12px;
        min-height: 56px;
        padding-left: 14px;
      }

      .music-title {
        max-width: 160px;
        font-size: 10px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="topbar">
      <a class="back" href="../index.html" aria-label="메인으로 돌아가기">← BACK TO MAIN</a>
      <p class="page-title">STILLS</p>
    </div>

    <section class="still-grid" aria-label="스틸 일러스트 아카이브">

      <article class="still-card" tabindex="0" data-still="1"
        data-images='["./IMG_1226(1).jpeg"]'
        data-title="Still 001">
        <div class="thumb">
          <img src="./IMG_1226(1).jpeg" alt="Still 001 썸네일" />
        </div>
        <div class="card-info">
          <p class="still-name">Still 001</p>
        </div>
      </article>

      <article class="still-card" tabindex="0" data-still="2"
        data-images='["./무제9_20240430103704.jpeg"]'
        data-title="Still 002">
        <div class="thumb">
          <img src="./무제9_20240430103704.jpeg" alt="Still 002 썸네일" />
        </div>
        <div class="card-info">
          <p class="still-name">Still 002</p>
        </div>
      </article>

      <!-- 세 번째 + 네 번째 일러스트를 하나의 Still로 묶음 -->
      <article class="still-card" tabindex="0" data-still="3"
        data-images='["./IMG_4932.jpeg","./IMG_6917.jpeg"]'
        data-title="Still 003">
        <div class="thumb">
          <img src="./IMG_4932.jpeg" alt="Still 003 썸네일" />
        </div>
        <div class="card-info">
          <p class="still-name">Still 003</p>
          <p class="multi-mark">2 IMAGES</p>
        </div>
      </article>

      <article class="still-card" tabindex="0" data-still="4"
        data-images='["./IMG_6919.jpeg"]'
        data-title="Still 004">
        <div class="thumb">
          <img src="./IMG_6919.jpeg" alt="Still 004 썸네일" />
        </div>
        <div class="card-info">
          <p class="still-name">Still 004</p>
        </div>
      </article>

      <article class="still-card" tabindex="0" data-still="5"
        data-images='["./IMG_8489.jpeg"]'
        data-title="Still 005">
        <div class="thumb">
          <img src="./IMG_8489.jpeg" alt="Still 005 썸네일" />
        </div>
        <div class="card-info">
          <p class="still-name">Still 005</p>
        </div>
      </article>

      <article class="still-card" tabindex="0" data-still="6"
        data-images='["./IMG_4539.jpeg"]'
        data-title="Still 006">
        <div class="thumb">
          <img src="./IMG_4539.jpeg" alt="Still 006 썸네일" />
        </div>
        <div class="card-info">
          <p class="still-name">Still 006</p>
        </div>
      </article>

      <article class="still-card" tabindex="0" data-still="7"
        data-images='["./IMG_8530.jpeg"]'
        data-title="Still 007">
        <div class="thumb">
          <img src="./IMG_8530.jpeg" alt="Still 007 썸네일" />
        </div>
        <div class="card-info">
          <p class="still-name">Still 007</p>
        </div>
      </article>

    </section>
  </main>

  <div class="viewer" id="viewer" aria-hidden="true">
    <button class="viewer-close" id="viewer-close" type="button" aria-label="닫기">CLOSE</button>

    <button class="nav-btn nav-prev" id="viewer-prev" type="button" aria-label="이전 이미지">‹</button>
    <button class="nav-btn nav-next" id="viewer-next" type="button" aria-label="다음 이미지">›</button>

    <div class="viewer-stage" id="viewer-stage">
      <img class="viewer-image" id="viewer-image" alt="" />
    </div>

    <div class="viewer-caption" id="viewer-caption"></div>
    <div class="viewer-counter" id="viewer-counter"></div>
  </div>

  <div class="music-player" id="music-player">
    <div class="music-left">
      <span class="music-icon">♫</span>
      <span class="music-title" id="music-title">Dive with You - Seori</span>
    </div>

    <div class="music-controls">
      <button aria-label="previous track" class="music-btn small" onclick="prevTrack()">‹</button>
      <button aria-label="play or pause" class="music-btn" id="music-btn" onclick="toggleMusic()">▶</button>
      <button aria-label="next track" class="music-btn small" onclick="nextTrack()">›</button>
    </div>

    <audio id="bgm" preload="metadata"></audio>
  </div>

  <script>
    (() => {
      const viewer = document.getElementById("viewer");
      const viewerImage = document.getElementById("viewer-image");
      const viewerCaption = document.getElementById("viewer-caption");
      const viewerCounter = document.getElementById("viewer-counter");
      const closeBtn = document.getElementById("viewer-close");
      const prevBtn = document.getElementById("viewer-prev");
      const nextBtn = document.getElementById("viewer-next");
      const stage = document.getElementById("viewer-stage");

      let currentImages = [];
      let currentIndex = 0;
      let currentTitle = "";
      let touchStartX = 0;

      function renderViewer() {
        if (!currentImages.length) return;

        viewerImage.src = currentImages[currentIndex];
        viewerImage.alt = currentTitle + " 전체 이미지";
        viewerCaption.textContent = currentTitle;

        const multiple = currentImages.length > 1;
        prevBtn.classList.toggle("show", multiple);
        nextBtn.classList.toggle("show", multiple);

        viewerCounter.textContent = multiple
          ? `${currentIndex + 1} / ${currentImages.length}`
          : "";
      }

      function openViewer(card) {
        try {
          currentImages = JSON.parse(card.dataset.images || "[]");
        } catch (_) {
          currentImages = [];
        }

        if (!currentImages.length) return;

        currentTitle = card.dataset.title || "Still";
        currentIndex = 0;

        renderViewer();
        viewer.classList.add("open");
        viewer.setAttribute("aria-hidden", "false");
        document.body.classList.add("modal-open");
      }

      function closeViewer() {
        viewer.classList.remove("open");
        viewer.setAttribute("aria-hidden", "true");
        document.body.classList.remove("modal-open");
        viewerImage.removeAttribute("src");
      }

      function move(direction) {
        if (currentImages.length <= 1) return;
        currentIndex = (currentIndex + direction + currentImages.length) % currentImages.length;
        renderViewer();
      }

      document.querySelectorAll(".still-card").forEach((card) => {
        card.addEventListener("click", () => openViewer(card));

        card.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openViewer(card);
          }
        });
      });

      closeBtn.addEventListener("click", closeViewer);
      prevBtn.addEventListener("click", () => move(-1));
      nextBtn.addEventListener("click", () => move(1));

      viewer.addEventListener("click", (event) => {
        if (event.target === viewer || event.target === stage) {
          closeViewer();
        }
      });

      window.addEventListener("keydown", (event) => {
        if (!viewer.classList.contains("open")) return;

        if (event.key === "Escape") closeViewer();
        if (event.key === "ArrowLeft") move(-1);
        if (event.key === "ArrowRight") move(1);
      });

      stage.addEventListener("touchstart", (event) => {
        touchStartX = event.changedTouches[0].clientX;
      }, { passive: true });

      stage.addEventListener("touchend", (event) => {
        if (currentImages.length <= 1) return;

        const endX = event.changedTouches[0].clientX;
        const diff = endX - touchStartX;

        if (Math.abs(diff) < 50) return;
        move(diff > 0 ? -1 : 1);
      }, { passive: true });
    })();
  </script>

  <script src="../common.js"></script>
</body>
</html>
