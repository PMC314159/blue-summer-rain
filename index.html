<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#dce6d7" />
  <link rel="icon" type="image/x-icon" href="./favicon.ico?v=20260915-2" />
  <link rel="shortcut icon" type="image/x-icon" href="./favicon.ico?v=20260915-2" />
  <title>Blue Summer Rain</title>

  <style>
    @font-face {
      font-family: "GmarketSans";
      src: url("./GmarketSansTTFLight.ttf") format("truetype");
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #dce6d7;
      --paper: #f7f9f4;
      --sage-dark: #4f5951;
      --tea: #9aa88f;
      --line: rgba(75, 91, 78, 0.20);
      --line-strong: rgba(75, 91, 78, 0.34);
      --shadow: rgba(45, 60, 49, 0.12);
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--sage-dark);
      font-family: "GmarketSans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 300;
      letter-spacing: -0.025em;
      background:
        radial-gradient(ellipse at 6% 0%, rgba(237,243,231,.50), transparent 58%),
        linear-gradient(145deg, #d8e7d1 0%, #dfe7db 52%, #dce3dc 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.08;
      background-image:
        linear-gradient(rgba(255,255,255,0.34) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.28) 1px, transparent 1px);
      background-size: 58px 58px;
      -webkit-mask-image: linear-gradient(to bottom, #000 0%, transparent 78%);
      mask-image: linear-gradient(to bottom, #000 0%, transparent 78%);
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; }

    .page {
      position: relative;
      z-index: 1;
      width: min(1180px, calc(100% - 44px));
      margin: 0 auto;
      padding: 46px 0 132px;
    }

    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
      padding-bottom: 22px;
      border-bottom: 1px solid rgba(75,96,79,.25);
    }

    .title {
      margin: 0;
      color: #4b604f;
      font-size: clamp(44px, 6.8vw, 82px);
      font-weight: 300;
      line-height: 0.98;
      letter-spacing: -0.065em;
    }

    .symbols {
      display: flex;
      align-items: center;
      gap: 9px;
      flex: 0 0 auto;
    }

    .symbol {
      width: 42px;
      color: #4b604f;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(75,96,79,.32);
      border-radius: 50%;
      background: rgba(247,251,243,.30);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .symbol svg {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.35;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .gallery {
      margin-top: 28px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .gallery-top {
      display: grid;
      grid-template-columns: minmax(0,.9fr) minmax(0,1.55fr);
      gap: 18px;
    }
    .gallery-bottom {
      display: grid;
      grid-template-columns: minmax(0,1.08fr) minmax(0,1fr);
      grid-template-areas: "timeline fragments" "stills fragments";
      width: 100%;
      height: auto;
      aspect-ratio: 1.34 / 1;
      grid-template-rows: minmax(0, 1fr) minmax(0, .5263158fr);
      gap: 18px;
      align-items: stretch;
    }
    .tile {
      position: relative;
      display: block;
      overflow: hidden;
      min-width: 0;
      min-height: 0;
      border-radius: var(--radius);
      background: var(--paper);
      transition: transform .28s ease, box-shadow .28s ease;
    }
    .tile img {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transition: transform .48s ease;
    }
    .tile:hover { transform: translateY(-3px); box-shadow: 0 18px 42px var(--shadow); }
    .tile:hover img { transform: scale(1.012); }
    .tile:focus-visible { outline: 2px solid #4b604f; outline-offset: 4px; }
    .romance-tile { aspect-ratio: 1; }
    .timeline-tile { grid-area: timeline; height: 100%; }
    .timeline-tile img { object-position: center 42%; }
    .stills-tile { grid-area: stills; height: 100%; }
    .fragments-tile { grid-area: fragments; height: 100%; }

    .music-player {
      position: fixed;
      z-index: 50;
      right: 22px;
      bottom: 20px;
      width: min(430px, calc(100% - 44px));
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 9px 11px 9px 16px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      background: rgba(245, 248, 242, 0.90);
      box-shadow: 0 14px 36px rgba(54, 68, 58, 0.12);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .music-left {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .music-icon {
      flex: 0 0 auto;
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      color: var(--tea);
      font-size: 16px;
    }

    .music-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11px;
    }

    .music-controls {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .music-btn {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--sage-dark);
      background: rgba(255,255,255,0.48);
      cursor: pointer;
    }

    .music-btn.small {
      width: 28px;
      height: 28px;
      border-color: transparent;
      background: transparent;
      font-size: 18px;
    }

    @media (max-width: 900px) {
      .page { width: min(calc(100% - 30px),760px); }
      .gallery, .gallery-top, .gallery-bottom { gap: 14px; }
    }
    @media (max-width: 600px) {
      .page { width: calc(100% - 24px); padding: 28px 0 118px; }
      .masthead { gap: 10px; padding-bottom: 16px; }
      .title { font-size: clamp(29px,7.7vw,46px); }
      .symbols { gap: 4px; }
      .symbol { width: 26px; height: 26px; }
      .symbol svg { width: 14px; height: 14px; }
      .gallery { margin-top: 16px; }
      .gallery, .gallery-top, .gallery-bottom { gap: 12px; }
      .gallery-top, .gallery-bottom {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: auto;
        aspect-ratio: auto;
      }
      .gallery .tile {
        flex: none;
        width: 100%;
        height: auto;
        aspect-ratio: auto;
        border-radius: 13px;
      }
      .gallery .tile img {
        position: static;
        width: 100%;
        height: auto;
        object-fit: contain;
        transform: none;
      }
      .music-player { left: 12px; right: 12px; bottom: 12px; width: auto; min-height: 56px; padding: 8px 9px 8px 13px; }
      .music-icon { display: none; }
      .music-title { font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .tile, .tile img { transition: none; }
      .tile:hover, .tile:hover img { transform: none; }
    }

    /* Page labels: always visible; descriptions appear on hover or focus. */
    .tile { isolation: isolate; }
    .tile::before {
      content: ""; position: absolute; inset: 0; z-index: 1;
      pointer-events: none;
      background: linear-gradient(to top, rgba(7,15,23,.78), rgba(7,15,23,.08) 48%, transparent 72%);
      opacity: .72; transition: opacity .32s ease;
    }
    .tile-content {
      position: absolute; z-index: 2; left: 24px; right: 24px; bottom: 23px;
      display: flex; justify-content: space-between; align-items: flex-end;
      gap: 16px; pointer-events: none;
    }
    .tile-copy { min-width: 0; }
    .tile-number { display: block; margin-bottom: 8px; color: #c4d7e7; font-size: 10px; letter-spacing: .23em; }
    .tile-title { display: block; color: #fff; font-size: clamp(23px,3vw,38px); line-height: 1.1; letter-spacing: -.045em; font-weight: 300; }
    .tile-desc {
      display: block; max-height: 0; overflow: hidden; margin-top: 0;
      opacity: 0; color: #e1e9ef; font-size: 12px; line-height: 1.6;
      transition: max-height .3s ease, margin .3s ease, opacity .3s ease;
    }
    .tile-arrow {
      display: grid; place-items: center; flex: 0 0 auto; width: 40px; height: 40px;
      border: 1px solid rgba(255,255,255,.5); border-radius: 50%;
      color: white; font-size: 23px; transition: background .3s ease, color .3s ease, transform .3s ease;
    }
    .tile:is(:hover,:focus-visible)::before { opacity: 1; }
    .tile:is(:hover,:focus-visible) .tile-desc { max-height: 6em; margin-top: 8px; opacity: 1; }
    .tile:is(:hover,:focus-visible) .tile-arrow { background: #f7f9f4; color: #25252a; transform: rotate(45deg); }
    @media (hover: none), (pointer: coarse) {
      .tile .tile-desc { max-height: none; margin-top: 8px; opacity: 1; }
    }
    @media (max-width: 600px) {
      .tile-content { left: 18px; right: 18px; bottom: 18px; gap: 12px; }
      .tile-heading { display: flex; gap: 10px; align-items: baseline; }
      .tile-number { margin-bottom: 0; }
      .tile-title { font-size: 27px; }
      .tile .tile-desc { max-height: none; margin-top: 7px; opacity: 1; font-size: 11px; }
      .tile-arrow { width: 36px; height: 36px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .tile::before, .tile-desc, .tile-arrow { transition: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="masthead">
      <h1 class="title">Blue Summer Rain</h1>
      <div class="symbols" aria-label="pair symbols">
        <span class="symbol" title="transparent umbrella" aria-label="transparent umbrella">
          <svg viewBox="0 0 24 24"><path d="M4 11.5a8 8 0 0 1 16 0H4Z"/><path d="M12 3.5v14.2c0 1.8.9 2.8 2.2 2.8 1.1 0 1.8-.7 1.8-1.7"/><path d="M7 11.5c.5-2.1 2.2-3.7 5-3.7s4.5 1.6 5 3.7" opacity=".55"/></svg>
        </span>
        <span class="symbol" title="summer shower" aria-label="summer shower">
          <svg viewBox="0 0 24 24"><path d="M6.5 8.5c.6-2.4 2.4-3.8 4.7-3.8 2.2 0 4 1.2 4.8 3.2.4-.2.9-.3 1.4-.3 1.8 0 3.1 1.2 3.1 2.8 0 1.7-1.4 2.9-3.3 2.9H6.7c-1.9 0-3.2-1.2-3.2-2.8 0-1.5 1.2-2.6 3-2.6"/><path d="M7 16.2 6.2 18M12 16.2 11 18.5M17 16.2 16.1 18.3"/></svg>
        </span>
        <span class="symbol" title="NGC 4038 × NGC 4039" aria-label="NGC 4038 × NGC 4039">
          <svg viewBox="0 0 24 24"><path d="M10.8 7.2c2.8-2 6.7-1.8 8.6.4 2 2.2 1.2 5.6-1.8 7.5-2.9 1.9-6.8 1.5-8.5-.7-1.7-2.1-.9-5.3 1.7-7.2Z"/><path d="M13.2 9.5c-2.6-2.1-6.2-2.4-8.3-.8-2.2 1.7-2.2 4.8.1 6.9 2.4 2.1 6.1 2.3 8.3.6"/></svg>
        </span>
      </div>
    </header>

    <section class="gallery" aria-label="archive navigation">
      <div class="gallery-top">
        <a class="tile romance-tile" href="./romance/index.html" aria-label="그때, 네가 나를 보았다">
          <img src="./IMG_1226.jpeg" alt="파란 배경 아래 하늘을 올려다보는 지서우" />
          <span class="tile-content">
            <span class="tile-copy">
              <span class="tile-heading"><span class="tile-number">01</span><span class="tile-title">Romance</span></span>
              <span class="tile-desc">그때, 네가 나를 보았다</span>
            </span>
            <span class="tile-arrow" aria-hidden="true">↗</span>
          </span>
        </a>
        <a class="tile personnel-tile" href="./personnel/index.html" aria-label="인물 소개">
          <img src="./personnel.png" alt="노란빛 아래 이어폰을 나눠 낀 준수와 서우" />
          <span class="tile-content">
            <span class="tile-copy">
              <span class="tile-heading"><span class="tile-number">02</span><span class="tile-title">Personnel</span></span>
              <span class="tile-desc">Junsu · Seowoo</span>
            </span>
            <span class="tile-arrow" aria-hidden="true">↗</span>
          </span>
        </a>
      </div>
      <div class="gallery-bottom">
        <a class="tile timeline-tile" href="./timeline/index.html" aria-label="타임라인">
          <img src="./timeline.png" alt="얼굴을 가까이 붙인 준수와 서우" loading="lazy" />
          <span class="tile-content">
            <span class="tile-copy">
              <span class="tile-heading"><span class="tile-number">03</span><span class="tile-title">Timeline</span></span>
              <span class="tile-desc">narrative sequence</span>
            </span>
            <span class="tile-arrow" aria-hidden="true">↗</span>
          </span>
        </a>
        <a class="tile stills-tile" href="./fragments/index.html" aria-label="written pieces">
          <img src="./fragments.PNG" alt="우산 속 준수와 서우" loading="lazy" />
          <span class="tile-content">
            <span class="tile-copy">
              <span class="tile-heading"><span class="tile-number">04</span><span class="tile-title">Fragments</span></span>
              <span class="tile-desc">written pieces</span>
            </span>
            <span class="tile-arrow" aria-hidden="true">↗</span>
          </span>
        </a>
        <a class="tile fragments-tile" href="./stills/index.html" aria-label="스틸 아카이브">
          <img src="./stills.jpg" alt="준수와 서우의 일러스트" loading="lazy" />
          <span class="tile-content">
            <span class="tile-copy">
              <span class="tile-heading"><span class="tile-number">05</span><span class="tile-title">Stills</span></span>
              <span class="tile-desc">visual archive</span>
            </span>
            <span class="tile-arrow" aria-hidden="true">↗</span>
          </span>
        </a>
      </div>
    </section>
  </main>

  <div class="music-player" id="music-player">
    <div class="music-left">
      <span class="music-icon">♫</span>
      <span class="music-title" id="music-title">Dive with You - Seori</span>
    </div>
    <div class="music-controls">
      <button aria-label="previous track" class="music-btn small" onclick="prevTrack()">‹</button>
      <button aria-label="play or pause" class="music-btn" id="music-btn" onclick="toggleMusic()">▶</button>
      <button aria-label="next track" class="music-btn small" onclick="nextTrack()">›</button>
    </div>
    <audio id="bgm" preload="metadata"></audio>
  </div>

  <script src="./common.js"></script>
</body>
</html>
