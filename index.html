<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#edf1e8" />
  <title>Blue Summer Rain</title>

  <style>
    @font-face {
      font-family: "GmarketSans";
      src: url("./GmarketSansTTFLight.ttf") format("truetype");
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #edf1e8;
      --paper: #f7f8f3;
      --tea: #bdc9b2;
      --tea-deep: #8f9e84;
      --sage: #718075;
      --sage-dark: #4d5b52;
      --line: rgba(73, 91, 77, 0.22);
      --line-strong: rgba(73, 91, 77, 0.36);
      --shadow: rgba(48, 64, 52, 0.13);
      --radius: 22px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--sage-dark);
      font-family: "GmarketSans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 300;
      letter-spacing: -0.025em;
      background:
        radial-gradient(circle at 12% 8%, rgba(201, 213, 188, 0.46), transparent 31%),
        radial-gradient(circle at 88% 82%, rgba(156, 173, 160, 0.20), transparent 29%),
        var(--bg);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.15;
      background-image:
        linear-gradient(rgba(255,255,255,0.33) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.25) 1px, transparent 1px);
      background-size: 56px 56px;
      -webkit-mask-image: linear-gradient(to bottom, #000 0%, transparent 78%);
      mask-image: linear-gradient(to bottom, #000 0%, transparent 78%);
    }

    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    button { font: inherit; }

    .page {
      position: relative;
      z-index: 1;
      width: min(1180px, calc(100% - 44px));
      margin: 0 auto;
      padding: 50px 0 148px;
    }

    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--line-strong);
    }

    .title {
      margin: 0;
      font-size: clamp(42px, 7vw, 82px);
      line-height: 0.98;
      font-weight: 300;
      letter-spacing: -0.065em;
      color: var(--sage-dark);
    }

    .symbols {
      display: flex;
      align-items: center;
      gap: 9px;
      flex: 0 0 auto;
    }

    .symbol {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--sage-dark);
      background: rgba(255,255,255,0.28);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .symbol svg {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.35;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .gallery {
      margin-top: 28px;
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 18px;
      align-items: start;
    }

    .tile {
      display: block;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--paper);
      transition: transform 0.30s ease, box-shadow 0.30s ease, border-color 0.30s ease;
    }

    .tile img {
      display: block;
      transition: transform 0.55s cubic-bezier(.2,.7,.2,1), filter 0.35s ease;
    }

    .tile::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(to bottom, rgba(235,242,229,0.01), rgba(70,88,75,0.035));
      transition: background 0.3s ease;
    }

    .tile:hover,
    .tile:focus-visible {
      transform: translateY(-3px);
      border-color: rgba(77, 97, 80, 0.56);
      box-shadow: 0 18px 42px var(--shadow);
      outline: none;
    }

    .tile:hover img,
    .tile:focus-visible img {
      transform: scale(1.012);
    }

    /* Main-page collage: five image links, no labels */
    .tendency-tile {
      grid-column: 1 / span 7;
      aspect-ratio: 8 / 5;
    }

    .personnel-tile {
      grid-column: 8 / span 5;
      aspect-ratio: 1 / 1;
    }

    .timeline-tile {
      grid-column: 1 / span 4;
      aspect-ratio: 4 / 5;
      margin-top: 2px;
    }

    .commission-tile {
      grid-column: 5 / span 4;
      aspect-ratio: 2 / 3;
      margin-top: 38px;
    }

    .fragments-tile {
      grid-column: 7 / span 6;
      aspect-ratio: 12 / 5;
      margin-top: 54px;
    }

    .tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .tendency-tile img { object-position: center 52%; }
    .personnel-tile img { object-position: center center; }
    .timeline-tile img { object-position: center 38%; }
    .commission-tile img { object-position: center center; }
    .fragments-tile img { object-position: center 48%; }

    /* music player */
    .music-player {
      position: fixed;
      z-index: 50;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      width: min(760px, calc(100% - 32px));
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
      padding: 12px 16px 12px 20px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      color: var(--sage-dark);
      background: rgba(243, 247, 239, 0.88);
      box-shadow: 0 15px 40px rgba(54, 68, 58, 0.13);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .music-left {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .music-icon {
      flex: 0 0 auto;
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      color: var(--tea-deep);
      font-size: 17px;
    }

    .music-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
    }

    .music-controls {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .music-btn {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--sage-dark);
      background: rgba(255,255,255,0.46);
      cursor: pointer;
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
    }

    .music-btn.small {
      width: 32px;
      height: 32px;
      border-color: transparent;
      background: transparent;
      font-size: 20px;
    }

    .music-btn:hover {
      transform: translateY(-1px);
      border-color: var(--line-strong);
      background: rgba(255,255,255,0.72);
    }

    @media (max-width: 760px) {
      .page {
        width: min(100% - 26px, 640px);
        padding-top: 28px;
        padding-bottom: 132px;
      }

      .masthead {
        align-items: flex-end;
        gap: 16px;
        padding-bottom: 17px;
      }

      .title { font-size: clamp(36px, 12vw, 58px); }
      .symbols { gap: 6px; }
      .symbol { width: 35px; height: 35px; }
      .symbol svg { width: 18px; height: 18px; }
      .gallery { margin-top: 18px; gap: 14px; }

      .gallery {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .tendency-tile,
      .personnel-tile,
      .timeline-tile,
      .commission-tile,
      .fragments-tile {
        grid-column: 1;
        margin-top: 0;
      }

      .tendency-tile { aspect-ratio: 8 / 5; }
      .personnel-tile { aspect-ratio: 1 / 1; }
      .timeline-tile { aspect-ratio: 4 / 5; }
      .commission-tile { aspect-ratio: 2 / 3; }
      .fragments-tile { aspect-ratio: 12 / 5; }
      .tile { border-radius: 17px; }

      .music-player {
        min-height: 60px;
        gap: 10px;
        padding: 9px 10px 9px 14px;
      }

      .music-title { font-size: 11px; }
      .music-icon { display: none; }
      .music-btn { width: 34px; height: 34px; }
      .music-btn.small { width: 28px; height: 28px; }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="masthead">
      <h1 class="title">Blue Summer Rain</h1>

      <div class="symbols" aria-label="pair symbols">
        <span class="symbol" title="transparent umbrella" aria-label="transparent umbrella">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 11.5a8 8 0 0 1 16 0H4Z" />
            <path d="M12 3.5v14.2c0 1.8.9 2.8 2.2 2.8 1.1 0 1.8-.7 1.8-1.7" />
            <path d="M7 11.5c.5-2.1 2.2-3.7 5-3.7s4.5 1.6 5 3.7" opacity=".55" />
          </svg>
        </span>

        <span class="symbol" title="summer shower" aria-label="summer shower">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6.5 8.5c.6-2.4 2.4-3.8 4.7-3.8 2.2 0 4 1.2 4.8 3.2.4-.2.9-.3 1.4-.3 1.8 0 3.1 1.2 3.1 2.8 0 1.7-1.4 2.9-3.3 2.9H6.7c-1.9 0-3.2-1.2-3.2-2.8 0-1.5 1.2-2.6 3-2.6" />
            <path d="M7 16.2 6.2 18M12 16.2 11 18.5M17 16.2 16.1 18.3" />
          </svg>
        </span>

        <span class="symbol" title="NGC 4038 × NGC 4039" aria-label="NGC 4038 × NGC 4039">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10.8 7.2c2.8-2 6.7-1.8 8.6.4 2 2.2 1.2 5.6-1.8 7.5-2.9 1.9-6.8 1.5-8.5-.7-1.7-2.1-.9-5.3 1.7-7.2Z" />
            <path d="M13.2 9.5c-2.6-2.1-6.2-2.4-8.3-.8-2.2 1.7-2 4.8.4 6.9 2.5 2.1 6.2 2.5 8.2.7 2-1.7 1.8-4.8-.3-6.8Z" opacity=".72" />
            <path d="M3.8 7.2c2.2-.5 4.1-.2 5.8.6M14.4 16.7c2.3.5 4.2.1 5.8-.9" opacity=".6" />
          </svg>
        </span>
      </div>
    </header>

    <section class="gallery" aria-label="archive navigation">
      <a class="tile tendency-tile" href="./tendency/" aria-label="계정 성향글 페이지로 이동">
        <img src="./tendency.PNG" alt="바다에서 함께 달리는 두 사람" fetchpriority="high" onerror="this.onerror=null; this.src='./tendency.png';" />
      </a>

      <a class="tile personnel-tile" href="./personnel/" aria-label="인물 소개 페이지로 이동">
        <img src="./personnel.png" alt="가까이 붙어 있는 두 사람의 얼굴" />
      </a>

      <a class="tile timeline-tile" href="./timeline/" aria-label="관계 타임라인 페이지로 이동">
        <img src="./timeline.jpg" alt="비 내리는 밤 함께 있는 두 사람" onerror="this.onerror=null; this.src='./timeline.JPG';" />
      </a>

      <a class="tile commission-tile" href="./commission/" aria-label="일러스트 커미션 아카이브 페이지로 이동">
        <img src="./commission.jpg" alt="비 내리는 날 함께 달리는 두 사람" />
      </a>

      <a class="tile fragments-tile" href="./fragments/" aria-label="글 커미션 아카이브 페이지로 이동">
        <img src="./fragments.png" alt="이어폰을 나눠 끼고 음악을 듣는 두 사람" />
      </a>
    </section>
  </main>

  <div class="music-player" id="music-player">
    <div class="music-left">
      <span class="music-icon">♫</span>
      <span class="music-title" id="music-title">Dive with You - Seori</span>
    </div>

    <div class="music-controls">
      <button aria-label="previous track" class="music-btn small" onclick="prevTrack()">‹</button>
      <button aria-label="play or pause" class="music-btn" id="music-btn" onclick="toggleMusic()">▶</button>
      <button aria-label="next track" class="music-btn small" onclick="nextTrack()">›</button>
    </div>

    <audio id="bgm" preload="metadata"></audio>
  </div>

  <script src="./common.js"></script>
</body>
</html>
